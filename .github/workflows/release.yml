name: Build and release executables

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build exe
        run: pyinstaller packaging/nahardrop.spec --distpath dist --workpath build --noconfirm
      - name: Rename artifact
        run: Copy-Item dist/nahardrop.exe dist/nahardrop-windows-x64.exe
      - name: Create release and attach exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nahardrop-windows-x64.exe
          generate_release_notes: true

  # Uploads to the release created by build-windows. Optional: a failure or
  # long queue here never affects the Windows release.
  build-macos:
    needs: build-windows
    runs-on: macos-14
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binary
        run: pyinstaller packaging/nahardrop.spec --distpath dist --workpath build --noconfirm
      - name: Rename artifact
        run: cp dist/nahardrop dist/nahardrop-macos-arm64
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/nahardrop-macos-arm64 --clobber --repo "${{ github.repository }}"
